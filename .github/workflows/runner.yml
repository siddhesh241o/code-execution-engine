name: Code Runner

on:
  workflow_dispatch:
    inputs:
      job_id: { required: true }
      fetch_url: { required: true }
      fetch_secret: { required: true }
      callback_url: { required: true }
      callback_secret: { required: true }

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Runner Script
        run: |
          set -euo pipefail

          # 1. Setup variables
          JOB_ID="${{ github.event.inputs.job_id }}"
          FETCH_URL="${{ github.event.inputs.fetch_url }}"
          FETCH_SECRET="${{ github.event.inputs.fetch_secret }}"
          CALLBACK_URL="${{ github.event.inputs.callback_url }}"
          CALLBACK_SECRET="${{ github.event.inputs.callback_secret }}"
          TIMEOUT_SEC=5

          echo "--- Phase 1: Fetching Job ---"
          JOB_JSON=$(curl -sS -f -H "Authorization: Bearer $FETCH_SECRET" "$FETCH_URL/$JOB_ID")

          LANG=$(echo "$JOB_JSON" | jq -r '.language')
          CODE=$(echo "$JOB_JSON" | jq -r '.code')
          STDIN=$(echo "$JOB_JSON" | jq -r '.input // ""')

          echo "--- Phase 2: Preparing Runner ---"
          mkdir -p runner
          STATUS=""
          RUN_CMD=""

          case "$LANG" in
            python)
              printf "%s" "$CODE" > runner/main.py
              RUN_CMD="python3 runner/main.py"
              ;;
            cpp)
              printf "%s" "$CODE" > runner/main.cpp
              g++ runner/main.cpp -O2 -std=c++17 -o runner/main || { STATUS="Compilation Error"; }
              RUN_CMD="./runner/main"
              ;;
            *)
              echo "Unsupported language: $LANG (only python and cpp supported)"
              exit 1
              ;;
          esac

          echo "--- Phase 3: Executing ---"
          OUT_FILE=$(mktemp)
          ERR_FILE=$(mktemp)
          START_TIME=$(date +%s%N)

          if [ -z "$STATUS" ]; then
            set +e
            timeout --preserve-status "${TIMEOUT_SEC}s" bash -c "printf '%s' \"$STDIN\" | $RUN_CMD" >"$OUT_FILE" 2>"$ERR_FILE"
            EXIT_CODE=$?
            set -e

            if [ "$EXIT_CODE" -eq 124 ]; then
              STATUS="Time Limit Exceeded"
            elif [ "$EXIT_CODE" -ne 0 ]; then
              STATUS="Runtime Error"
            else
              STATUS="Successfully Executed"
            fi
          fi
          
          END_TIME=$(date +%s%N)
          DURATION_MS=$(( (END_TIME - START_TIME) / 1000000 ))

          echo "--- Phase 4: Posting Result ---"
          PAYLOAD=$(jq -n \
            --arg id "$JOB_ID" \
            --arg stdout "$(head -c 10000 "$OUT_FILE")" \
            --arg stderr "$(head -c 10000 "$ERR_FILE")" \
            --arg status "$STATUS" \
            --argjson duration "$DURATION_MS" \
            '{id: $id, stdout: $stdout, stderr: $stderr, status: $status, time_ms: $duration}')

          curl -sS -f -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CALLBACK_SECRET" \
            -d "$PAYLOAD" \
            "$CALLBACK_URL"

          echo "Done. Status: $STATUS"